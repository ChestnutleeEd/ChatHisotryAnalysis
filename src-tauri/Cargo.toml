[package]
name = "chat-history-analysis"
version = "0.1.0"
description = "Local, privacy-preserving chat history analysis desktop shell"
authors = ["ChatHisotryAnalysis"]
edition = "2021"
rust-version = "1.85"
default-run = "chat-history-analysis"

[features]
default = ["synthetic-test-helpers"]
synthetic-test-helpers = []
synthetic-dialog-adapter = []
packaged-b5-acceptance = ["synthetic-dialog-adapter"]
packaged-b6-acceptance = ["synthetic-dialog-adapter"]

[[bin]]
name = "chat-history-analysis"
path = "src/main.rs"

[[bin]]
name = "synthetic-sidecar"
path = "src/bin/synthetic-sidecar.rs"
required-features = ["synthetic-test-helpers"]

[[bin]]
name = "synthetic-orphan"
path = "src/bin/synthetic-orphan.rs"
required-features = ["synthetic-test-helpers"]

[lib]
name = "chat_history_analysis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
libc = "=0.2.189"
png = "=0.18.1"
tauri = { version = "=2.11.3", features = [] }
tokio = { version = "=1.53.1", features = ["rt", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "=0.6.2" }
objc2 = { version = "=0.6.4" }
objc2-foundation = { version = "=0.3.2" }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["WKFrameInfo", "WKNavigationAction", "WKSecurityOrigin", "WKUIDelegate", "WKWebView", "WKWebViewConfiguration", "WKWindowFeatures", "block2", "objc2-app-kit"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
